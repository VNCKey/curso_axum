[package]
name = "tokio_course"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "migrate", "sqlite", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
validator = { version = "0.21.0", features = ["derive"] }
